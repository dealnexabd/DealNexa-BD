<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Welcome to DealNexa BD</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans Bengali",sans-serif;color:#fff;background:radial-gradient(circle at 15% 15%,#263e70 0,transparent 35%),linear-gradient(135deg,#0b1220,#172943 55%,#101827);display:flex;align-items:center;justify-content:center;padding:22px}
    .welcome{width:min(100%,720px);text-align:center;padding:42px 24px;border:1px solid rgba(255,255,255,.14);border-radius:26px;background:rgba(255,255,255,.07);box-shadow:0 24px 70px rgba(0,0,0,.3);backdrop-filter:blur(10px)}
    .logo{width:82px;height:82px;margin:0 auto 18px;border-radius:24px;background:linear-gradient(135deg,#ffb000,#ff6b35);display:grid;place-items:center;font-size:38px;font-weight:900;color:#142033;box-shadow:0 12px 30px rgba(255,153,0,.25)}
    h1{font-size:clamp(30px,7vw,48px);margin:0 0 12px;letter-spacing:-1px}
    h1 span{color:#ffbd45}
    .tag{font-size:clamp(16px,3.8vw,20px);color:#e7edf7;margin:0 0 12px}
    .desc{max-width:520px;margin:0 auto 28px;color:#bdc9da;line-height:1.8;font-size:15px}
    .shop{display:inline-block;text-decoration:none;background:linear-gradient(135deg,#ffbd45,#ff7b32);color:#172033;font-weight:800;padding:15px 34px;border-radius:999px;font-size:17px;box-shadow:0 10px 24px rgba(255,139,45,.25);transition:.2s}
    .shop:hover{transform:translateY(-2px);filter:brightness(1.06)}
    .note{margin-top:24px;color:#93a3ba;font-size:12px}
  </style>
</head>
<body>
  <main class="welcome">
    <div class="logo" aria-label="DealNexa BD logo">D</div>
    <h1>Welcome to <span>DealNexa BD</span></h1>
    <p class="tag">সেরা ডিল, পছন্দের পণ্য — এক জায়গায়!</p>
    <p class="desc">আপনার পছন্দের পণ্য খুঁজে নিন সহজেই। নতুন অফার ও পণ্যের আপডেট পেতে আমাদের অনলাইন শপ ঘুরে দেখুন।</p>
    <a class="shop" href="./index.html">SHOP NOW&nbsp; →</a>
    <p class="note">© <span id="year"></span> DealNexa BD. All rights reserved.</p>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
